<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profit Radar - Business Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            color: #01579b;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        header p {
            font-size: 1rem;
            color: #0277bd;
            opacity: 0.8;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(1, 87, 155, 0.1);
            border-left: 5px solid #0288d1;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(1, 87, 155, 0.15);
        }

        .stat-card.revenue {
            border-left-color: #4caf50;
        }

        .stat-card.expense {
            border-left-color: #ff6f00;
        }

        .stat-card.profit {
            border-left-color: #1976d2;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #0277bd;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #01579b;
        }

        .stat-card.revenue .stat-value {
            color: #2e7d32;
        }

        .stat-card.expense .stat-value {
            color: #e65100;
        }

        .stat-card.profit .stat-value {
            color: #1565c0;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(1, 87, 155, 0.1);
        }

        .card h2 {
            color: #01579b;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #0277bd;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #b3e5fc;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #0288d1;
            box-shadow: 0 0 0 3px rgba(2, 136, 209, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        button {
            background: linear-gradient(135deg, #0288d1 0%, #0277bd 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 136, 209, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-delete {
            background: linear-gradient(135deg, #ff6f00 0%, #e65100 100%);
            padding: 8px 16px;
            font-size: 0.85rem;
            width: auto;
            margin-left: 10px;
        }

        .btn-delete:hover {
            box-shadow: 0 6px 20px rgba(255, 111, 0, 0.3);
        }

        .btn-edit {
            background: linear-gradient(135deg, #4caf50 0%, #388e3c 100%);
            padding: 8px 16px;
            font-size: 0.85rem;
            width: auto;
            margin-right: 10px;
        }

        .btn-edit:hover {
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.3);
        }

        .entries-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .entry-item {
            background: #f5f5f5;
            border-left: 4px solid #0288d1;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .entry-item:hover {
            background: #eeeeee;
            box-shadow: 0 2px 8px rgba(1, 87, 155, 0.1);
        }

        .entry-item.revenue {
            border-left-color: #4caf50;
        }

        .entry-item.expense {
            border-left-color: #ff6f00;
        }

        .entry-info {
            flex: 1;
        }

        .entry-type {
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: 700;
            color: #0277bd;
            margin-bottom: 5px;
        }

        .entry-description {
            color: #01579b;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .entry-date {
            font-size: 0.85rem;
            color: #0277bd;
            opacity: 0.7;
        }

        .entry-amount {
            font-size: 1.3rem;
            font-weight: 700;
            margin-right: 15px;
            min-width: 100px;
            text-align: right;
        }

        .entry-amount.revenue {
            color: #2e7d32;
        }

        .entry-amount.expense {
            color: #e65100;
        }

        .entry-actions {
            display: flex;
            gap: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #0277bd;
        }

        .empty-state p {
            font-size: 1.1rem;
            opacity: 0.7;
        }

        .radar-chart {
            width: 100%;
            height: 300px;
            position: relative;
            margin-top: 20px;
        }

        .radar-container {
            position: relative;
            width: 100%;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .radar-circle {
            position: absolute;
            border: 2px solid #b3e5fc;
            border-radius: 50%;
        }

        .radar-label {
            position: absolute;
            font-size: 0.85rem;
            color: #0277bd;
            font-weight: 600;
        }

        .radar-point {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .radar-point.revenue {
            background: #4caf50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        .radar-point.expense {
            background: #ff6f00;
            box-shadow: 0 0 10px rgba(255, 111, 0, 0.5);
        }

        .success-message {
            background: #c8e6c9;
            color: #2e7d32;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .success-message.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .scrollbar::-webkit-scrollbar {
            width: 8px;
        }

        .scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .scrollbar::-webkit-scrollbar-thumb {
            background: #0288d1;
            border-radius: 10px;
        }

        .scrollbar::-webkit-scrollbar-thumb:hover {
            background: #0277bd;
        }

        .entries-list {
            scrollbar-color: #0288d1 #f1f1f1;
            scrollbar-width: thin;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Profit Radar</h1>
            <p>Track your business revenue and expenses in real-time</p>
        </header>

        <div class="dashboard">
            <div class="stat-card revenue">
                <div class="stat-label">Total Revenue</div>
                <div class="stat-value" id="totalRevenue">₱0.00</div>
            </div>
            <div class="stat-card expense">
                <div class="stat-label">Total Expenses</div>
                <div class="stat-value" id="totalExpense">₱0.00</div>
            </div>
            <div class="stat-card profit">
                <div class="stat-label">Net Profit</div>
                <div class="stat-value" id="netProfit">₱0.00</div>
            </div>
        </div>

        <div class="main-content">
            <div class="card">
                <h2>Add Entry</h2>
                <div class="success-message" id="successMessage">Entry added successfully!</div>
                
                <form id="entryForm">
                    <div class="form-group">
                        <label for="type">Type</label>
                        <select id="type" required>
                            <option value="">Select Type</option>
                            <option value="revenue">Revenue</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="e.g., Sales, Rent, Utilities" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="amount">Amount (₱)</label>
                            <input type="number" id="amount" placeholder="0.00" step="0.01" min="0" required>
                        </div>
                        <div class="form-group">
                            <label for="date">Date</label>
                            <input type="date" id="date" required>
                        </div>
                    </div>

                    <button type="submit">Add Entry</button>
                </form>
            </div>

            <div class="card">
                <h2>Profit Radar</h2>
                <div class="radar-container" id="radarContainer">
                    <div class="radar-circle" style="width: 200px; height: 200px;"></div>
                    <div class="radar-circle" style="width: 100px; height: 100px;"></div>
                    <div class="radar-label" style="top: 10px; left: 50%; transform: translateX(-50%);">Revenue</div>
                    <div class="radar-label" style="bottom: 10px; left: 50%; transform: translateX(-50%);">Expenses</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Recent Entries</h2>
            <div class="entries-list scrollbar" id="entriesList">
                <div class="empty-state">
                    <p>No entries yet. Add your first entry to get started!</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize date input with today's date
        document.getElementById('date').valueAsDate = new Date();

        // Load data from localStorage
        function loadData() {
            const data = localStorage.getItem('profitRadarData');
            return data ? JSON.parse(data) : [];
        }

        // Save data to localStorage
        function saveData(data) {
            localStorage.setItem('profitRadarData', JSON.stringify(data));
        }

        // Update dashboard statistics
        function updateDashboard() {
            const entries = loadData();
            const totalRevenue = entries
                .filter(e => e.type === 'revenue')
                .reduce((sum, e) => sum + parseFloat(e.amount), 0);
            const totalExpense = entries
                .filter(e => e.type === 'expense')
                .reduce((sum, e) => sum + parseFloat(e.amount), 0);
            const netProfit = totalRevenue - totalExpense;

            document.getElementById('totalRevenue').textContent = `₱${totalRevenue.toFixed(2)}`;
            document.getElementById('totalExpense').textContent = `₱${totalExpense.toFixed(2)}`;
            document.getElementById('netProfit').textContent = `₱${netProfit.toFixed(2)}`;

            // Update profit radar
            updateRadar(totalRevenue, totalExpense);
        }

        // Update radar visualization
        function updateRadar(revenue, expense) {
            const container = document.getElementById('radarContainer');
            const existingPoints = container.querySelectorAll('.radar-point');
            existingPoints.forEach(p => p.remove());

            const maxValue = Math.max(revenue, expense, 1000);
            const centerX = container.offsetWidth / 2;
            const centerY = container.offsetHeight / 2;
            const maxRadius = 80;

            // Revenue point
            const revenueRadius = (revenue / maxValue) * maxRadius;
            const revenuePoint = document.createElement('div');
            revenuePoint.className = 'radar-point revenue';
            revenuePoint.style.left = centerX + 'px';
            revenuePoint.style.top = (centerY - revenueRadius) + 'px';
            container.appendChild(revenuePoint);

            // Expense point
            const expenseRadius = (expense / maxValue) * maxRadius;
            const expensePoint = document.createElement('div');
            expensePoint.className = 'radar-point expense';
            expensePoint.style.left = centerX + 'px';
            expensePoint.style.top = (centerY + expenseRadius) + 'px';
            container.appendChild(expensePoint);
        }

        // Render entries list
        function renderEntries() {
            const entries = loadData();
            const entriesList = document.getElementById('entriesList');

            if (entries.length === 0) {
                entriesList.innerHTML = '<div class="empty-state"><p>No entries yet. Add your first entry to get started!</p></div>';
                return;
            }

            entriesList.innerHTML = entries
                .sort((a, b) => new Date(b.date) - new Date(a.date))
                .map((entry, index) => `
                    <div class="entry-item ${entry.type}">
                        <div class="entry-info">
                            <div class="entry-type">${entry.type}</div>
                            <div class="entry-description">${entry.description}</div>
                            <div class="entry-date">${new Date(entry.date).toLocaleDateString()}</div>
                        </div>
                        <div class="entry-amount ${entry.type}">₱${parseFloat(entry.amount).toFixed(2)}</div>
                        <div class="entry-actions">
                            <button class="btn-edit" onclick="editEntry(${index})">Edit</button>
                            <button class="btn-delete" onclick="deleteEntry(${index})">Delete</button>
                        </div>
                    </div>
                `)
                .join('');
        }

        // Add entry
        document.getElementById('entryForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const entry = {
                type: document.getElementById('type').value,
                description: document.getElementById('description').value,
                amount: document.getElementById('amount').value,
                date: document.getElementById('date').value
            };

            const entries = loadData();
            entries.push(entry);
            saveData(entries);

            // Show success message
            const successMsg = document.getElementById('successMessage');
            successMsg.classList.add('show');
            setTimeout(() => successMsg.classList.remove('show'), 3000);

            // Reset form
            this.reset();
            document.getElementById('date').valueAsDate = new Date();

            updateDashboard();
            renderEntries();
        });

        // Delete entry
        function deleteEntry(index) {
            if (confirm('Are you sure you want to delete this entry?')) {
                const entries = loadData();
                entries.splice(index, 1);
                saveData(entries);
                updateDashboard();
                renderEntries();
            }
        }

        // Edit entry
        function editEntry(index) {
            const entries = loadData();
            const entry = entries[index];

            document.getElementById('type').value = entry.type;
            document.getElementById('description').value = entry.description;
            document.getElementById('amount').value = entry.amount;
            document.getElementById('date').value = entry.date;

            deleteEntry(index);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initial load
        updateDashboard();
        renderEntries();
    </script>
</body>
</html>
